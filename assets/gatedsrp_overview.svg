<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Gated SRP overview</title>
  <desc id="desc">Pipeline showing WSI patch features and coordinates feeding attention, local spatial redundancy projection, a signed gate, and downstream prediction.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6f1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#28536b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: url(#panel); stroke: #d6e3ea; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #28536b; stroke-width: 2; rx: 12; }
      .box2 { fill: #fffaf0; stroke: #b46b32; stroke-width: 2; rx: 12; }
      .box3 { fill: #f3fbf6; stroke: #2e7d5b; stroke-width: 2; rx: 12; }
      .title { font: 700 24px Arial, sans-serif; fill: #153243; }
      .label { font: 700 17px Arial, sans-serif; fill: #153243; }
      .small { font: 14px Arial, sans-serif; fill: #38515c; }
      .tiny { font: 12px Arial, sans-serif; fill: #516770; }
      .mono { font: 13px "DejaVu Sans Mono", Consolas, monospace; fill: #25343b; }
      .arrow { stroke: #28536b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .grid { stroke: #d0dbe0; stroke-width: 1; }
      .patchA { fill: #9fd3c7; }
      .patchB { fill: #f5c16c; }
      .patchC { fill: #95b8d1; }
      .patchD { fill: #e99b9b; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="430"/>
  <rect class="panel" x="24" y="24" width="1072" height="382" rx="20"/>

  <text x="52" y="66" class="title">Gated Spatial Redundancy Projection</text>
  <text x="52" y="94" class="small">A drop-in attention correction for whole-slide pathology transformers.</text>

  <rect class="box" x="55" y="135" width="190" height="145"/>
  <text x="78" y="166" class="label">WSI tokens</text>
  <text x="78" y="191" class="small">Frozen patch features</text>
  <text x="78" y="212" class="small">plus level-0 coords</text>
  <g transform="translate(78,228)">
    <rect class="patchA" x="0" y="0" width="18" height="18" rx="3"/>
    <rect class="patchA" x="22" y="0" width="18" height="18" rx="3"/>
    <rect class="patchB" x="44" y="0" width="18" height="18" rx="3"/>
    <rect class="patchA" x="0" y="22" width="18" height="18" rx="3"/>
    <rect class="patchC" x="22" y="22" width="18" height="18" rx="3"/>
    <rect class="patchB" x="44" y="22" width="18" height="18" rx="3"/>
    <rect class="patchD" x="0" y="44" width="18" height="18" rx="3"/>
    <rect class="patchC" x="22" y="44" width="18" height="18" rx="3"/>
    <rect class="patchC" x="44" y="44" width="18" height="18" rx="3"/>
  </g>

  <path class="arrow" d="M255 207 C285 207, 295 207, 325 207"/>

  <rect class="box" x="335" y="135" width="190" height="145"/>
  <text x="362" y="166" class="label">Self-attention</text>
  <text x="362" y="191" class="small">Compute per-head</text>
  <text x="362" y="212" class="small">attention output y</text>
  <text x="362" y="246" class="mono">Q, K, V -> y</text>

  <path class="arrow" d="M535 207 C565 207, 575 207, 605 207"/>

  <rect class="box2" x="615" y="116" width="225" height="184"/>
  <text x="642" y="149" class="label">Local redundancy axis</text>
  <text x="642" y="174" class="small">For each patch, average</text>
  <text x="642" y="195" class="small">neighbor value vectors.</text>
  <text x="642" y="229" class="mono">r_i = mean(V_j), j in N(i)</text>
  <text x="642" y="253" class="mono">r_hat_i = normalize(r_i)</text>
  <text x="642" y="277" class="tiny">Uses the coordinate grid, not a slide-wide mean.</text>

  <path class="arrow" d="M850 207 C880 207, 890 207, 920 207"/>

  <rect class="box3" x="930" y="116" width="145" height="184"/>
  <text x="955" y="149" class="label">Signed gate</text>
  <text x="955" y="174" class="small">Token + head</text>
  <text x="955" y="195" class="small">adaptive beta</text>
  <text x="955" y="229" class="mono">z = y - beta</text>
  <text x="955" y="251" class="mono">    * &lt;y,r&gt; r</text>
  <text x="955" y="277" class="tiny">Identity at initialization.</text>

  <path class="arrow" d="M1002 310 C1002 340, 876 354, 756 354"/>
  <rect class="box" x="510" y="323" width="230" height="58"/>
  <text x="532" y="348" class="label">Slide or patient task</text>
  <text x="532" y="370" class="small">Classification, grading, survival</text>

  <text x="52" y="346" class="small">The correction can preserve, subtract, or reflect the locally common component instead of forcing every token through one fixed rule.</text>
</svg>
